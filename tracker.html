<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEORE Tracker</title>

<link rel="stylesheet" href="tracker.css">

</head>


<body>


<div class="container">


<h1>MEORE TRACKER</h1>


<div id="status">

TRACKER READY

</div>


<div id="data">


Distance:
<span id="distance">0</span> m

<br><br>

Points:
<span id="points">0</span>

<br><br>

</div>



<button id="start-btn">
START TRACKER
</button>


<button id="stop-btn">
STOP TRACKER
</button>


<button onclick="goBack()">
BACK
</button>



</div>


<script src="tracker.js"></script>


</body>

</html>
