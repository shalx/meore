<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix-Pin v7 RED LED</title>

<link rel="manifest" href="manifest.json">

<style>
body{
    margin:0;
    background:#000;
    font-family:"Courier New", monospace;
    color:#ff1a1a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{ width:90%; max-width:500px; text-align:center; }

.title{
    font-size:28px;
    letter-spacing:3px;
    margin-bottom:20px;
    text-shadow:0 0 10px #ff1a1a;
}

.screen{
    border:1px solid #ff1a1a;
    padding:20px;
    box-shadow:0 0 20px #ff1a1a;
}

.value{
    font-size:32px;
    font-weight:bold;
    text-shadow:0 0 10px #ff1a1a;
    margin:10px 0;
}

.small{ font-size:16px; opacity:0.9; }

button{
    background:transparent;
    border:1px solid #ff1a1a;
    color:#ff1a1a;
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
}

button:hover{
    background:#ff1a1a;
    color:#000;
}

.list{
    margin-top:20px;
    text-align:left;
    font-size:14px;
    max-height:200px;
    overflow:auto;
    border-top:1px solid #ff1a1a;
    padding-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="title">FIX-PIN v7 PWA</div>

<div class="screen">
    <div class="value" id="lat">LAT --</div>
    <div class="value" id="lon">LON --</div>
    <div class="small" id="acc">ACC --</div>
    <div class="small" id="time">TIME --</div>
</div>

<div>
    <button onclick="fixPin()">FIX</button>
    <button onclick="savePin()">SAVE</button>
</div>

<div class="list" id="list"></div>

</div>

<script>

let lastData=null;

function fixPin(){
navigator.geolocation.getCurrentPosition(pos=>{
const c=pos.coords;
const now=new Date().toLocaleTimeString();

lastData={
lat:c.latitude.toFixed(6),
lon:c.longitude.toFixed(6),
acc:c.accuracy.toFixed(1),
time:now
};

lat.innerText="LAT "+lastData.lat;
lon.innerText="LON "+lastData.lon;
acc.innerText="ACC "+lastData.acc+" m";
time.innerText="TIME "+lastData.time;

},{enableHighAccuracy:true});
}

function savePin(){
if(!lastData)return;

let data=JSON.parse(localStorage.getItem("pins")||"[]");
data.push(lastData);
localStorage.setItem("pins",JSON.stringify(data));
render();
}

function render(){
let data=JSON.parse(localStorage.getItem("pins")||"[]");
let html="<b>SAVED</b><br><br>";

data.slice().reverse().forEach((p,i)=>{
html+=`#${data.length-i} ${p.lat}, ${p.lon}<br>`;
});

list.innerHTML=html;
}

render();

// register service worker
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
