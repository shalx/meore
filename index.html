<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#7c4dff"
    >

    <title>Meore Free</title>


    <!-- Основной стиль -->
    <link
        rel="stylesheet"
        href="css/style.css?v=6"
    >
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
>

    <!-- PWA -->
    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="icon"
        href="favicon.ico"
        sizes="any"
    >

    <link
        rel="apple-touch-icon"
        href="icon-192.png"
    >

</head>


<body>

    <main class="app-container">


        <!-- Заголовок -->
        <header class="app-header">

            <h1>
                MEORE FREE
            </h1>

            <p class="app-subtitle">
                Save your location
            </p>

        </header>


        <!-- Получение координат -->
        <button
            id="pin-btn"
            class="primary-button"
            type="button"
        >
            PIN
        </button>


        <!-- Карточка координат -->
        <section class="coordinates-box">

            <div class="coordinate-row">

                <span class="coordinate-label">
                    Latitude
                </span>

                <span
                    id="latitude-value"
                    class="coordinate-value"
                >
                    —
                </span>

            </div>


            <div class="coordinate-row">

                <span class="coordinate-label">
                    Longitude
                </span>

                <span
                    id="longitude-value"
                    class="coordinate-value"
                >
                    —
                </span>

            </div>


            <div class="coordinate-row">

                <span class="coordinate-label">
                    Accuracy
                </span>

                <span
                    id="accuracy-value"
                    class="coordinate-value"
                >
                    —
                </span>

            </div>


            <div class="coordinate-row">

                <span class="coordinate-label">
                    Time
                </span>

                <span
                    id="time-value"
                    class="coordinate-value"
                >
                    —
                </span>

            </div>

        </section>


        <!-- Статус -->
        <p
            id="status-message"
            class="status-message"
        >
            Координаты ещё не получены
        </p>


        <!-- Заметка -->
        <section class="note-section">

            <label
                class="input-label"
                for="note-input"
            >
                NOTE
            </label>

            <input
                id="note-input"
                class="note-input"
                type="text"
                maxlength="200"
                autocomplete="off"
                placeholder="Введите заметку"
            >

        </section>


        <!-- Основные действия -->
        <section class="main-actions">

            <button
                id="save-btn"
                class="primary-button"
                type="button"
                disabled
            >
                SAVE
            </button>


            <button
                id="saved-points-btn"
                class="outlined-button"
                type="button"
            >
                SAVED POINTS
            </button>

        </section>


        <!-- Google Drive -->
        <section class="drive-section">

            <button
                id="restore-btn"
                class="text-button"
                type="button"
            >
                RESTORE FROM GOOGLE DRIVE
            </button>

        </section>

    </main>


    <!-- Основные модули -->
    <script src="js/storage.js?v=6"></script>
    <script src="js/maps.js?v=6"></script>
    <script src="js/app.js?v=6"></script>


    <!-- Google Identity Services -->
    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer
    ></script>


    <!-- Google Drive -->
    <script src="js/drive.js?v=6"></script>

</body>

</html>
