<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meore - Geolocation Pins</title>
</head>
<body>

    <!-- Кнопка определения координат -->
    <button id="pin-btn" onclick="getLocation()">PIN 🎯</button>

    <!-- Вывод текущих координат -->
    <div id="coordinates-display">Координаты еще не получены</div>

    <br>
    <!-- Поле для заметки -->
    <input type="text" id="note-input" placeholder="Добавить заметку для локации...">
    
    <!-- Кнопка сохранения локально -->
    <button id="save-btn" onclick="saveLocation()">SAVE ✓</button>

    <!-- НОВАЯ КНОПКА: Синхронизация с Google -->
    <button id="sync-btn" onclick="handleSyncClick()">Google Sync 🔄</button>

    <hr>
    <h3>Сохраненные локации:</h3>
    <div id="locations-list">Список пуст.</div>

    <!-- ПОДКЛЮЧЕНИЕ БИБЛИОТЕКИ GOOGLE (Обязательно перед app.js) -->
    <script src="https://google.com" onload="gapiLoaded()" async defer></script>
    
    <!-- Подключаем логику -->
    <script src="app.js"></script>
</body>
</html>
