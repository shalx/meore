<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тбилиси Пробки</title>
    <link rel="manifest" href="manifest.json">
    <!-- Легкие карты Leaflet (работают плавно на слабом процессоре) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #ebebeb; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Координаты Тбилиси: [41.7151, 44.8271], масштаб 13 (оптимально для города)
    const map = L.map('map').setView([41.7151, 44.8271], 13);

    // Базовая легкая подложка карты OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Живой слой дорожной разметки и транспортного потока
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
        pane: 'shadowPane',
        maxZoom: 20
    }).addTo(map);
</script>

</body>
</html>
