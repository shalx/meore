<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тбилиси Пробки</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Растягиваем интерфейс на весь экран магнитолы */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #222; font-family: sans-serif; }
        .map-container { width: 100%; height: 100%; position: relative; display: flex; justify-content: center; align-items: center; }
        img { width: 100%; height: 100%; object-fit: cover; }
        /* Кнопка ручного обновления для водителя */
        .refresh-btn { position: absolute; bottom: 20px; right: 20px; background: #ffcc00; color: #000; border: none; padding: 15px 25px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 16px; }
        .refresh-btn:active { background: #ddb300; }
    </style>
</head>
<body>

<div class="map-container">
    <!-- Живая статическая карта Тбилиси с дорожной ситуацией -->
    <img id="trafficMap" src="https://yandex.ru" alt="Карта Пробок">
    
    <button class="refresh-btn" onclick="updateTraffic()">Обновить пробки</button>
</div>

<script>
    // Функция для автоматического и ручного обновления дорожной ситуации
    function updateTraffic() {
        var mapImg = document.getElementById('trafficMap');
        // Добавляем случайный параметр времени, чтобы принудительно обновить картинку пробок
        mapImg.src = "https://yandex.ru&timestamp=" + new Date().getTime();
    }

    // Автоматически обновлять пробки каждые 2 минуты во время движения в машине
    setInterval(updateTraffic, 120000);
</script>

</body>
</html>
