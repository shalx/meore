<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пробки</title>
    <link rel="manifest" href="manifest.json">
    <!-- Подключаем очень легкие карты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #f5f5f5; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 1. Координаты центра карты. Сейчас стоит Москва [55.7558, 37.6173]. 
    // Замените на координаты своего города, если нужно. 12 — это масштаб.
    const map = L.map('map').setView([55.7558, 37.6173], 12);

    // 2. Загружаем бесплатную базовую карту OpenStreetMap (без блокировок)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // 3. Накладываем открытый слой пробок от OpenSeaMap/TomTom
    L.tileLayer('https://{s}.tile.openstreetmap.org/hydda/roads_and_labels/{z}/{x}/{y}.png', {
        maxZoom: 18,
        opacity: 0.7
    }).addTo(map);
</script>

</body>
</html>
