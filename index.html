<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix-Pin v5 PRO (Stable)</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.15.0/maps/maps.css">

<style>
html, body {
    margin: 0;
    height: 100%;
    background: #0b0f14;
    font-family: Arial;
}

#map {
    width: 100%;
    height: 100vh;
}

#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 999;
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="hud">Fix-Pin v5 loading...</div>
<div id="map"></div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.15.0/maps/maps-web.min.js"></script>

<script>
const API_KEY = "p2AWikBN6D0RCBEzYWQ7dmltR9KhtyEo";

let map;
let marker;

function init() {

    map = tt.map({
        key: API_KEY,
        container: "map",
        center: [44.8271, 41.7151],
        zoom: 7,
        style: "https://api.tomtom.com/style/1/style/22.2.1-9/basic_main.json?key=" + API_KEY
    });

    map.addControl(new tt.FullscreenControl());

    // 🇬🇪 LIMIT GEORGIA
    map.setMaxBounds([
        [40.5, 39.0],
        [47.8, 44.8]
    ]);

    map.on('load', () => {

        // ✅ OFFICIAL TRAFFIC PLUGINS (THIS IS THE KEY FIX)
        map.addControl(new tt.TrafficFlowControl());
        map.addControl(new tt.TrafficIncidentsControl());

        document.getElementById("hud").innerText =
            "Fix-Pin v5 PRO • Traffic ON 🇬🇪";
    });

    // GPS
    navigator.geolocation.watchPosition(
        (pos) => {

            const user = [pos.coords.longitude, pos.coords.latitude];

            map.setCenter(user);
            map.setZoom(13);

            if (!marker) {
                marker = new tt.Marker({ color: "red" })
                    .setLngLat(user)
                    .addTo(map);
            } else {
                marker.setLngLat(user);
            }
        },
        () => {
            document.getElementById("hud").innerText =
                "GPS denied";
        }
    );
}

init();
</script>

</body>
</html>
