<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meore — Minimalist Pins</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --card-bg: #1e1e1e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { font-size: 24px; margin: 0; color: var(--accent-color); }
        .auth-btn {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
        }
        button.action-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        /* Чисто текстовый список без сеток и карт */
        .pins-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }
        .pin-item {
            background-color: var(--card-bg);
            padding: 14px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent-color);
        }
        .pin-info a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
        }
        .pin-info span {
            display: block;
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #cf6679;
            cursor: pointer;
            font-size: 14px;
        }
        /* Будущее место под баннер AdMob */
        .ad-banner-mock {
            width: 100%;
            height: 50px;
            background-color: #222;
            border: 1px dashed #444;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #666;
            margin-top: auto;
            border-radius: 4px;
        }
        .remove-ads-link {
            text-align: center;
            display: block;
            font-size: 12px;
            color: var(--accent-color);
            margin-top: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>meore</h1>
            <button class="auth-btn" id="authBtn" onclick="toggleAuth()">Sync Google</button>
        </header>

        <div class="input-group">
            <input type="text" id="pinInput" placeholder="Paste link or text here...">
            <button class="action-btn" onclick="addPin()">FIX / SAVE</button>
        </div>

        <div class="pins-list" id="pinsList">
            <!-- Сюда JS будет рендерить текстовые пины -->
        </div>

        <!-- Контейнер для рекламы -->
        <div id="adContainer">
            <div class="ad-banner-mock">AdMob Banner Space</div>
            <a href="#" class="remove-ads-link" onclick="removeAdsPurchase(event)">Remove Ads ($1.99)</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
