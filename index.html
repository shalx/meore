```html
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Мой Личный Навигатор</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #121212;
            color: white;

        }

        body {

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

        }

        .container {

            width: 100%;
            max-width: 400px;

            padding: 30px 20px;

            background: #1e1e1e;

            border-radius: 24px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.5);

        }

        h1 {

            margin: 0 0 25px;

            text-align: center;

            font-size: 20px;

            color: #e0e0e0;

        }

        .controls {

            padding: 18px 15px;

            margin-bottom: 25px;

            background: #2d2d2d;

            border-radius: 16px;

        }

        .controls label {

            display: block;

            margin-bottom: 15px;

            text-align: center;

            font-size: 15px;

            font-weight: bold;

            color: #34a853;

        }

        .controls input {

            display: block;

            width: 100%;

            margin: 0;

            accent-color: #34a853;

        }

        .scale {

            display: flex;

            justify-content: space-between;

            margin-top: 8px;

            color: #888;

            font-size: 11px;

        }

        .launch-btn {

            display: block;

            width: 100%;

            padding: 16px 0;

            border-radius: 16px;

            background: #34a853;

            color: white;

            text-align: center;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;

            box-shadow:
                0 4px 12px rgba(52, 168, 83, 0.4);

            transition:
                background 0.2s,
                transform 0.1s;

        }

        .launch-btn:active {

            background: #2b8c44;

            transform: scale(0.98);

        }

        .hint {

            margin-top: 15px;

            color: #777;

            text-align: center;

            font-size: 12px;

        }

    </style>

</head>


<body>


    <div class="container">

        <h1>🚗 Свободная езда без пробок</h1>


        <div class="controls">

            <label id="rangeLabel">
                Дальность пробок: Средняя (~5 км)
            </label>

            <input
                type="range"
                id="zoomRange"
                min="12"
                max="18"
                value="15"
                step="1"
            >

            <div class="scale">

                <span>Весь город</span>

                <span>Вблизи</span>

            </div>

        </div>


        <a
            id="openMapBtn"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="launch-btn"
        >
            ОТКРЫТЬ КАРТУ ПРОБОК
        </a>


        <div class="hint">
            Карта откроется в Google Maps
        </div>

    </div>


    <script>

        const slider =
            document.getElementById("zoomRange");

        const label =
            document.getElementById("rangeLabel");

        const btn =
            document.getElementById("openMapBtn");


        /*
         * Координаты центра Тбилиси
         */

        const latitude = 41.7151;
        const longitude = 44.8271;


        /*
         * Описание каждого масштаба
         */

        const distanceTexts = {

            12: "Весь город (~30 км)",

            13: "Большой район (~15 км)",

            14: "Дальний обзор (~10 км)",

            15: "Средняя (~5 км)",

            16: "Ближняя (~2 км)",

            17: "Только перекрёстки (~1 км)",

            18: "В упор (~500 метров)"

        };


        /*
         * Создаём ссылку Google Maps
         */

        function updateMapLink() {

            const zoom =
                parseInt(slider.value, 10);


            /*
             * Google Maps URL:
             *
             * /@latitude,longitude,zoomz
             *
             * layer=traffic
             * включает слой дорожного движения.
             */

            const url =
                "https://www.google.com/maps/@" +
                latitude +
                "," +
                longitude +
                "," +
                zoom +
                "z/data=!5m1!1e1";


            btn.href = url;


            label.textContent =
                "Дальность пробок: " +
                distanceTexts[zoom];

        }


        /*
         * При движении ползунка
         */

        slider.addEventListener(
            "input",
            updateMapLink
        );


        /*
         * Устанавливаем ссылку
         * сразу после загрузки страницы.
         */

        updateMapLink();

    </script>


</body>

</html>
```
