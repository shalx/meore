<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meore - Geolocation Pins</title>
    
    <!-- ПОДКЛЮЧАЕМ БИБЛИОТЕКУ ДЛЯ РАБОТЫ С EXCEL (SheetJS) -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <button id="pin-btn" onclick="getLocation()">PIN 🎯</button>
    <div id="coordinates-display">Координаты еще не получены</div>

    <br>
    <input type="text" id="note-input" placeholder="Добавить заметку для локации...">
    <button id="save-btn" onclick="saveLocation()">SAVE ✓</button>
    
    <br><br>
    <!-- НОВЫЕ КНОПКИ ДЛЯ EXCEL -->
    <button id="export-btn" onclick="exportToExcel()">Save to Excel 📥</button>
    
    <!-- Кнопка Load визуально запускает скрытый выбор файла -->
    <button id="load-btn" onclick="document.getElementById('file-input').click()">Load from Excel 📤</button>
    <input type="file" id="file-input" accept=".xlsx, .xls" onchange="importFromExcel(event)" style="display: none;">

    <hr>
    <h3>Сохраненные локации:</h3>
    <div id="locations-list">Список пуст.</div>

    <script src="app.js"></script>
</body>
</html>
