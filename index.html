<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08110d"
    >

    <title>Meore Free</title>

 <link rel="stylesheet" href="css/style.css?v=5">

    <link
        rel="manifest"
        href="manifest.json"
    >
</head>

<body>

    <main class="app-container">

        <h1>MEORE FREE</h1>

        <!-- Получение координат -->
        <button
            id="pin-btn"
            type="button"
        >
            PIN
        </button>


        <!-- Координаты -->
        <section class="coordinates-box">

            <p>
                Latitude:
                <span id="latitude-value">—</span>
            </p>

            <p>
                Longitude:
                <span id="longitude-value">—</span>
            </p>

            <p>
                Accuracy:
                <span id="accuracy-value">—</span>
            </p>

            <p>
                Time:
                <span id="time-value">—</span>
            </p>

        </section>


        <!-- Статус -->
        <p id="status-message">
            Координаты ещё не получены
        </p>


        <!-- Заметка -->
        <label for="note-input">
            NOTE
        </label>

        <input
            id="note-input"
            type="text"
            maxlength="200"
            autocomplete="off"
            placeholder="Введите заметку"
        >


        <!-- Сохранение -->
        <button
            id="save-btn"
            type="button"
            disabled
        >
            SAVE
        </button>


        <!-- Переход к сохранённым точкам -->
        <button
            id="saved-points-btn"
            type="button"
        >
            SAVED POINTS
        </button>
        <button id="restore-btn">
    RESTORE<br>
    FROM GOOGLE DRIVE
</button>

    </main>


<script src="js/storage.js?v=5"></script>
<script src="js/maps.js?v=5"></script>
<script src="js/app.js?v=5"></script>

<script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
</script>

<script src="js/drive.js?v=5"></script>

</body>

</html>
