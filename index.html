<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix-Pin Traffic</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.15.0/maps/maps.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0f14;
    font-family: Arial;
}

#map {
    width: 100%;
    height: 100vh;
}

#panel {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 999;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="panel">Fix-Pin loading...</div>
<div id="map"></div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.15.0/maps/maps-web.min.js"></script>

<script>
const API_KEY = "YOUR_TOMTOM_API_KEY";

let map;
let marker;

function init() {

    map = tt.map({
        key: API_KEY,
        container: "map",
        center: [44.8271, 41.7151],
        zoom: 13,
        style: "https://api.tomtom.com/style/1/style/22.2.1-9/basic_main.json?key=" + API_KEY
    });

    // ✅ TRAFFIC LAYERS (ВАЖНО)
    map.on('load', function () {

        // Traffic flow layer
        map.addLayer({
            id: 'traffic-flow',
            type: 'line',
            source: {
                type: 'vector',
                tiles: [
                    `https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.pbf?key=${API_KEY}`
                ]
            },
            'source-layer': 'Traffic flow',
            paint: {
                'line-color': '#ff3b30',
                'line-width': 2
            }
        });

        document.getElementById("panel").innerText =
            "Fix-Pin • traffic ON";
    });

    // GPS
    navigator.geolocation.watchPosition(
        (pos) => {
            const user = [pos.coords.longitude, pos.coords.latitude];

            map.setCenter(user);

            if (!marker) {
                marker = new tt.Marker().setLngLat(user).addTo(map);
            } else {
                marker.setLngLat(user);
            }
        },
        () => {
            document.getElementById("panel").innerText =
                "Location denied";
        }
    );
}

init();
</script>

</body>
</html>
