<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix-Pin v7 RED LED</title>

<style>
body{
    margin:0;
    background:#000;
    font-family:"Courier New", monospace;
    color:#ff1a1a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:500px;
    text-align:center;
}

.title{
    font-size:28px;
    letter-spacing:3px;
    margin-bottom:20px;
    text-shadow:0 0 10px #ff1a1a;
}

.screen{
    border:1px solid #ff1a1a;
    padding:20px;
    box-shadow:0 0 20px #ff1a1a;
}

.value{
    font-size:32px;
    font-weight:bold;
    text-shadow:
        0 0 5px #ff1a1a,
        0 0 10px #ff1a1a,
        0 0 20px #ff1a1a;
    margin:10px 0;
}

.small{
    font-size:16px;
    opacity:0.9;
}

.buttons{
    margin-top:20px;
}

button{
    background:transparent;
    border:1px solid #ff1a1a;
    color:#ff1a1a;
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
    font-weight:bold;
    text-shadow:0 0 5px #ff1a1a;
    transition:0.2s;
}

button:hover{
    background:#ff1a1a;
    color:#000;
}

.list{
    margin-top:20px;
    text-align:left;
    font-size:14px;
    max-height:200px;
    overflow:auto;
    border-top:1px solid #ff1a1a;
    padding-top:10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">FIX-PIN v7</div>

    <div class="screen">
        <div class="value" id="lat">LAT --</div>
        <div class="value" id="lon">LON --</div>

        <div class="small" id="acc">ACC --</div>
        <div class="small" id="alt">ALT --</div>
        <div class="small" id="time">TIME --</div>
    </div>

    <div class="buttons">
        <button onclick="fixPin()">FIX</button>
        <button onclick="savePin()">SAVE</button>
    </div>

    <div class="list" id="list"></div>

</div>

<script>

let lastData = null;

function fixPin(){
    navigator.geolocation.getCurrentPosition(pos => {

        const c = pos.coords;

        const now = new Date().toLocaleTimeString();

        lastData = {
            lat: c.latitude.toFixed(6),
            lon: c.longitude.toFixed(6),
            acc: c.accuracy.toFixed(1),
            alt: c.altitude ? c.altitude.toFixed(1) : "n/a",
            time: now
        };

        document.getElementById("lat").innerText = "LAT " + lastData.lat;
        document.getElementById("lon").innerText = "LON " + lastData.lon;
        document.getElementById("acc").innerText = "ACC " + lastData.acc + " m";
        document.getElementById("alt").innerText = "ALT " + lastData.alt;
        document.getElementById("time").innerText = "TIME " + lastData.time;

    }, err => {
        alert("GPS error: " + err.message);
    }, {
        enableHighAccuracy:true
    });
}

function savePin(){

    if(!lastData) return;

    let data = JSON.parse(localStorage.getItem("pins") || "[]");

    data.push(lastData);

    localStorage.setItem("pins", JSON.stringify(data));

    renderList();
}

function renderList(){

    let data = JSON.parse(localStorage.getItem("pins") || "[]");

    let html = "<b>SAVED POINTS</b><br><br>";

    data.slice().reverse().forEach((p, i) => {
        html += `#${data.length - i} ${p.lat}, ${p.lon} | ${p.time}<br>`;
    });

    document.getElementById("list").innerHTML = html;
}

renderList();

</script>

</body>
</html>
