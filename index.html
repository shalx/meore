<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тбилиси Пробки</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #ebebeb; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Точные координаты центра Тбилиси
    const map = L.map('map').setView([41.7151, 44.8271], 13);

    // Чистая базовая карта OpenStreetMap (без блокировок)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);
</script>

</body>
</html>
