<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix-Pin v4 Georgia (Stable)</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.15.0/maps/maps.css">

<style>
html, body {
    margin: 0;
    height: 100%;
    background: #0b0f14;
    font-family: Arial;
}

#map {
    width: 100%;
    height: 100vh;
}

#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 999;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="hud">Fix-Pin v4 loading...</div>
<div id="map"></div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.15.0/maps/maps-web.min.js"></script>

<script>
const API_KEY = "p2AWikBN6D0RCBEzYWQ7dmltR9KhtyEo";

let map;
let userMarker;

function init() {

    map = tt.map({
        key: API_KEY,
        container: "map",
        center: [44.8271, 41.7151],
        zoom: 7,
        style: "https://api.tomtom.com/style/1/style/22.2.1-9/basic_main.json?key=" + API_KEY
    });

    map.addControl(new tt.FullscreenControl());

    // 🇬🇪 LIMIT GEORGIA AREA
    map.setMaxBounds([
        [40.5, 39.0],
        [47.8, 44.8]
    ]);

    map.on('load', function () {

        // ✅ REAL TRAFFIC LAYER (CORRECT TOMTOM WAY)
        map.addLayer({
            id: 'traffic-flow',
            type: 'line',
            source: {
                type: 'vector',
                tiles: [
                    `https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.pbf?key=${API_KEY}`
                ]
            },
            'source-layer': 'Traffic flow',
            paint: {
                'line-color': [
                    'match',
                    ['get', 'traffic_level'],
                    0, '#00c853',
                    1, '#ffd600',
                    2, '#ff9100',
                    3, '#d50000',
                    '#999'
                ],
                'line-width': 3
            }
        });

        document.getElementById("hud").innerText =
            "Fix-Pin v4 • traffic ON 🇬🇪";
    });

    // 📍 GPS
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
            (pos) => {

                const user = [pos.coords.longitude, pos.coords.latitude];

                map.setCenter(user);
                map.setZoom(12);

                if (!userMarker) {
                    userMarker = new tt.Marker().setLngLat(user).addTo(map);
                } else {
                    userMarker.setLngLat(user);
                }

                document.getElementById("hud").innerText =
                    "Fix-Pin v4 • live Georgia traffic 🚗";
            },
            () => {
                document.getElementById("hud").innerText =
                    "Fix-Pin v4 • location denied";
            }
        );
    }
}

init();
</script>

</body>
</html>
