<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix-Pin v4 • Georgia Traffic</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.15.0/maps/maps.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0f14;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100vh;
}

#hud {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 999;
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
    backdrop-filter: blur(10px);
}
</style>
</head>

<body>

<div id="hud">Fix-Pin v4 • Georgia traffic loading...</div>
<div id="map"></div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.15.0/maps/maps-web.min.js"></script>

<script>
const API_KEY = "p2AWikBN6D0RCBEzYWQ7dmltR9KhtyEo";

let map;
let marker;

// 🇬🇪 Georgia bounds (rough)
const GEORGIA_CENTER = [44.8271, 41.7151];

function initMap() {

    map = tt.map({
        key: API_KEY,
        container: "map",
        center: GEORGIA_CENTER,
        zoom: 7,
        style: "https://api.tomtom.com/style/1/style/22.2.1-9/basic_main.json?key=" + API_KEY
    });

    map.addControl(new tt.FullscreenControl());

    // limit view to Georgia area
    map.setMaxBounds([
        [40.0, 39.0], // SW
        [47.5, 44.5]  // NE
    ]);

    map.on('load', () => {

        map.showTrafficFlow();
        map.showTrafficIncidents();

        document.getElementById("hud").innerText =
            "Fix-Pin v4 • Georgia traffic ON 🇬🇪";
    });

    // GPS tracking
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
            (pos) => {

                const user = [pos.coords.longitude, pos.coords.latitude];

                map.setCenter(user);
                map.setZoom(12);

                if (!marker) {
                    marker = new tt.Marker()
                        .setLngLat(user)
                        .addTo(map);
                } else {
                    marker.setLngLat(user);
                }

                document.getElementById("hud").innerText =
                    "Fix-Pin v4 • live traffic in Georgia 🚗";
            },
            () => {
                document.getElementById("hud").innerText =
                    "Fix-Pin v4 • location denied";
            },
            {
                enableHighAccuracy: true,
                maximumAge: 5000,
                timeout: 10000
            }
        );
    }
}

initMap();
</script>

</body>
</html>
