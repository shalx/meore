<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тбилиси Пробки</title>
    <link rel="manifest" href="manifest.json">
    <!-- Подключаем легкую библиотеку Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #ebebeb; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Инициализируем карту Тбилиси (Координаты: 41.7151, 44.8271)
    const map = L.map('map').setView([41.7151, 44.8271], 13);

    // Загружаем чистую карту без блокировок фрейма
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Накладываем живые пробки TomTom Traffic (полностью открытый слой для всего мира)
    L.tileLayer('https://{s}.tile.openstreetmap.org/hydda/roads_and_labels/{z}/{x}/{y}.png', {
        maxZoom: 18,
        opacity: 0.6
    }).addTo(map);
</script>

</body>
</html>
