<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix-Pin v6 AI MODE</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.15.0/maps/maps.css">

<style>
html, body {
    margin: 0;
    height: 100%;
    background: #0b0f14;
    font-family: Arial;
}

#map {
    width: 100%;
    height: 100vh;
}

#ai {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 9999;
    background: rgba(0,0,0,0.85);
    color: #00ffae;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 12px;
    white-space: pre-line;
}
</style>
</head>

<body>

<div id="ai">AI MODE starting...</div>
<div id="map"></div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.15.0/maps/maps-web.min.js"></script>

<script>
const API_KEY = "p2AWikBN6D0RCBEzYWQ7dmltR9KhtyEo";

const ai = document.getElementById("ai");

function log(msg) {
    ai.innerHTML += "\n" + msg;
}

function init() {

    log("✔ SDK loaded");

    let map = tt.map({
        key: API_KEY,
        container: "map",
        center: [44.8271, 41.7151],
        zoom: 7
    });

    log("✔ Map created (NO custom style)");

    map.addControl(new tt.FullscreenControl());

    map.on("load", () => {

        log("✔ Map loaded");

        try {
            map.showTrafficFlow();
            map.showTrafficIncidents();
            log("✔ Traffic enabled");
        } catch (e) {
            log("❌ Traffic error: " + e.message);
        }
    });

    if (navigator.geolocation) {

        navigator.geolocation.watchPosition(
            (pos) => {

                const user = [pos.coords.longitude, pos.coords.latitude];

                log("✔ GPS: " + user[1].toFixed(4) + "," + user[0].toFixed(4));

                map.setCenter(user);
                map.setZoom(13);

                new tt.Marker({ color: "red" })
                    .setLngLat(user)
                    .addTo(map);
            },
            (err) => {
                log("❌ GPS error: " + err.message);
            }
        );
    } else {
        log("❌ GPS not supported");
    }
}

init();
</script>

</body>
</html>
