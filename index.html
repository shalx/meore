<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мой Личный Навигатор</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #121212; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .container {
            text-align: center; width: 90%; max-width: 400px;
            background: #1e1e1e; padding: 30px 20px; border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { font-size: 20px; margin-bottom: 25px; color: #e0e0e0; }
        .controls {
            background: #2d2d2d; padding: 15px; border-radius: 16px; margin-bottom: 25px;
        }
        .controls label { font-size: 15px; font-weight: bold; display: block; margin-bottom: 10px; color: #34a853; }
        .controls input { width: 100%; margin: 10px 0; }
        .launch-btn {
            display: inline-block; width: 100%; padding: 16px 0;
            background: #34a853; color: white; font-size: 18px; font-weight: bold;
            text-decoration: none; border-radius: 16px; transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(52, 168, 83, 0.4);
            text-align: center;
        }
        .launch-btn:active { background: #2b8c44; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚗 Свободная езда без пробок</h1>
        
        <div class="controls">
            <label id="rangeLabel">Дальность пробок: Средняя (5 км)</label>
            <input type="range" id="zoomRange" min="12" max="18" value="15" step="1">
        </div>
        
        <!-- Изначально ссылка настроена на средний масштаб (15z) -->
        <a id="openMapBtn" href="https://google.com" target="_blank" class="launch-btn">ОТКРЫТЬ КАРТУ ПРОБОК</a>
    </div>

    <script>
        const slider = document.getElementById('zoomRange');
        const label = document.getElementById('rangeLabel');
        const btn = document.getElementById('openMapBtn');

        // Четкие, проверенные прямые ссылки для Тбилиси под каждый масштаб
        const mapLinks = {
            12: "https://google.com",
            13: "https://google.com",
            14: "https://google.com",
            15: "https://google.com",
            16: "https://google.com",
            17: "https://google.com",
            18: "https://google.com"
        };

        const distanceTexts = { 
            12: "Весь город (~30 км)", 
            13: "Большой район (~15 км)", 
            14: "Дальний обзор (~10 км)", 
            15: "Средняя (5 км)", 
            16: "Ближняя (~2 км)", 
            17: "Только перекрестки (~1 км)", 
            18: "В упор (~500 метров)" 
        };

        slider.addEventListener('input', function() { 
            const zoomValue = parseInt(this.value); 
            // Переключаем на готовую ссылку из списка выше
            btn.href = mapLinks[zoomValue];
            label.innerText = "Дальность пробок: " + distanceTexts[zoomValue]; 
        });
    </script>
</body>
</html>
