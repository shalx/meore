<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Fix Pin Simple</title>
</head>
<body>

<h3>FIX PIN SIMPLE</h3>

<div>
  <p id="coords">coords: -</p>
  <p id="comment">comment: -</p>
</div>

<button onclick="getFix()">FIX</button>
<button onclick="saveData()">SAVE</button>
<button onclick="loadData()">LOAD</button>
<button onclick="addComment()">COMMENT</button>
<button onclick="openMap()">OPEN MAP</button>

<script>

let currentLat = null;
let currentLon = null;
let userComment = "";

function getFix() {
  if (!navigator.geolocation) {
    alert("Geolocation not supported");
    return;
  }

  navigator.geolocation.getCurrentPosition((pos) => {
    currentLat = pos.coords.latitude;
    currentLon = pos.coords.longitude;

    document.getElementById("coords").innerText =
      "coords: " + currentLat + ", " + currentLon;
  },
  (err) => {
    alert("Error: " + err.message);
  });
}

function saveData() {
  if (currentLat === null) {
    alert("No coords to save");
    return;
  }

  const data = {
    lat: currentLat,
    lon: currentLon,
    comment: userComment
  };

  localStorage.setItem("fixpin_data", JSON.stringify(data));
  alert("Saved");
}

function loadData() {
  const data = JSON.parse(localStorage.getItem("fixpin_data"));

  if (!data) {
    alert("No saved data");
    return;
  }

  currentLat = data.lat;
  currentLon = data.lon;
  userComment = data.comment || "";

  document.getElementById("coords").innerText =
    "coords: " + currentLat + ", " + currentLon;

  document.getElementById("comment").innerText =
    "comment: " + userComment;
}

function addComment() {
  const text = prompt("Enter comment:");
  if (text !== null) {
    userComment = text;
    document.getElementById("comment").innerText = "comment: " + userComment;
  }
}

function openMap() {
  if (currentLat === null) {
    alert("No coords");
    return;
  }

  const url = "https://www.google.com/maps?q=" + currentLat + "," + currentLon;
  window.open(url, "_blank");
}

</script>

</body>
</html>
