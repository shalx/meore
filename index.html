<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тбилиси Пробки</title>
    <link rel="manifest" href="manifest.json">
    <!-- Подключаем официальный JS API Яндекс Карт -->
    <script src="https://yandex.ru" type="text/javascript"></script>
    <style>
        body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #ebebeb; }
    </style>
</head>
<body>

<div id="map"></div>

<script type="text/javascript">
    // Ждем загрузки API карт
    ymaps.ready(init);
    function init(){
        // Создаем карту Тбилиси
        var myMap = new ymaps.Map("map", {
            center: [41.7151, 44.8271], // Координаты Тбилиси
            zoom: 13,
            controls: ['zoomControl'] // Только кнопки плюс/минус, чтобы не перегружать слабую магнитолу
        });

        // Включаем слой пробок автоматически при запуске!
        var trafficControl = new ymaps.control.TrafficControl({ state: { providerKey: 'traffic#actual', trafficShown: true } });
        myMap.controls.add(trafficControl);
    }
</script>

</body>
</html>
