<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тбилиси Пробки</title>
    <link rel="manifest" href="manifest.json">
    <!-- Подключаем стили и скрипт Leaflet из открытого и надежного источника cdnjs -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    <style>
        /* Растягиваем карту на весь экран магнитолы без полос прокрутки */
        body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Создаем карту и центрируем ее на Тбилиси [Широта, Долгота]
    var map = L.map('map', {
        zoomControl: true,
        maxZoom: 18,
        minZoom: 10
    }).setView([41.7151, 44.8271], 13);

    // Загружаем открытые карты Voyager от CartoDB (базируются на OpenStreetMap)
    // Этот сервер открыт для всех сайтов и никогда не заблокирует вашу магнитолу
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Накладываем живую дорожную разметку улиц Тбилиси
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
        maxZoom: 18
    }).addTo(map);
</script>

</body>
</html>
