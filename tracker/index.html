<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Tracker Night</title>

<link rel="stylesheet" href="tracker.css">

</head>

<body>

<div class="container">

<h1>TRACKER</h1>

<div class="status">

Status

<span id="status">
READY
</span>

</div>

<div class="card">

<label>

Record interval

</label>

<select id="interval">

<option value="5">5 sec</option>

<option value="10" selected>10 sec</option>

<option value="30">30 sec</option>

<option value="60">60 sec</option>

</select>

</div>

<div class="stats">

<div>

Distance

<span id="distance">

0.000 km

</span>

</div>

<div>

Duration

<span id="duration">

00:00:00

</span>

</div>

<div>

Points

<span id="points">

0

</span>

</div>

</div>

<div class="buttons">

<button id="startBtn">

START

</button>

<button id="stopBtn">

STOP

</button>

</div>

<button id="saveBtn">

SAVE ROUTE

</button>

<h2>

Saved Routes

</h2>

<div id="routes">

No routes

</div>

<button id="backBtn">

BACK

</button>

</div>

<script src="storage.js"></script>
<script src="tracker.js"></script>
<script src="route.js"></script>

</body>
</html>
